spring:
  application:
    name: wei-picture-backend
  mvc:
    servlet:
      path: /api
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wei_picture?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: w20040720..


server:
  port: 8123
mybatis-plus:
  configuration:
    # MyBatis 下划线转驼峰
    map-underscore-to-camel-case: true
    # 日志配置 - 打印 SQL 语句到控制台
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    # 全局配置
    db-config:
      # 主键策略
      id-type: auto
      # 逻辑删除配置
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# springdoc-openapi????
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.xiaowei.weipicturebackend.controller
# knife4j???????????????
knife4j:
  enable: true
  setting:
    language: zh_cn
